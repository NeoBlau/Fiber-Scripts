<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiber Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: «пульт аналитика» — левая навигация, сверху полоса глобальных переключателей,
   справа плотные рабочие панели. Цвет изменения: синий = рост, красный = падение (безопасно для дальтоников). */
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --surface-3: #e3e8f0;
  --line: #d9dfe8;
  --fg: #12161c;
  --fg-2: #485263;
  --fg-3: #7a8496;
  --accent: #0e6f68;
  --accent-ink: #ffffff;
  --accent-soft: #d8efec;
  --up: #2a78d6;
  --down: #d93f3f;
  --up-soft: #dbe9fb;
  --down-soft: #fbdede;
  --total: #5d6879;
  --mid: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --shadow: 0 1px 2px rgba(18, 22, 28, .06), 0 4px 16px rgba(18, 22, 28, .05);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1115; --surface: #161a20; --surface-2: #1c2129; --surface-3: #252b35; --line: #2b323d;
    --fg: #eef1f5; --fg-2: #b2bccb; --fg-3: #7f8a9b;
    --accent: #2bb5a6; --accent-ink: #062320; --accent-soft: #123532;
    --up: #3987e5; --down: #e66767; --up-soft: #16283f; --down-soft: #3a1c1e; --total: #8f9aac; --mid: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1115; --surface: #161a20; --surface-2: #1c2129; --surface-3: #252b35; --line: #2b323d;
  --fg: #eef1f5; --fg-2: #b2bccb; --fg-3: #7f8a9b;
  --accent: #2bb5a6; --accent-ink: #062320; --accent-soft: #123532;
  --up: #3987e5; --down: #e66767; --up-soft: #16283f; --down-soft: #3a1c1e; --total: #8f9aac; --mid: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- каркас ---------- */
.app { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; border-right: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .01em; line-height: 1.1; }
.brand-name small { display: block; font: 500 10.5px/1.2 var(--f-body); color: var(--fg-3); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--fg-2); cursor: pointer; text-align: left; font-weight: 500;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 0; }
.rail-foot .muted { font-size: 12px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.tb-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb-label { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.content { padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* ---------- элементы управления ---------- */
.select, .input {
  height: 34px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  min-width: 0; max-width: 100%;
}
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
.input { padding: 0 10px; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { width: 34px; padding: 0; }
.period-nav { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.period-nav button { border: 0; background: transparent; width: 30px; height: 32px; cursor: pointer; color: var(--fg-2); font-size: 16px; }
.period-nav button:hover { color: var(--fg); }
.period-nav select { border: 0; height: 32px; background: transparent; font-weight: 600; padding: 0 4px; cursor: pointer; max-width: 150px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.chip.flat { background: var(--surface-2); color: var(--fg-3); }
.chip.new { background: var(--accent-soft); color: var(--accent); font-family: var(--f-body); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--fg-2); font-size: 11.5px; }
.muted { color: var(--fg-3); }
.dim { color: var(--fg-2); }

/* ---------- панели ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 18px; }
.page-title { margin: 0; font: 600 22px/1.15 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.page-sub { margin: 4px 0 0; color: var(--fg-2); max-width: 70ch; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.g-2e { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 14px 16px 6px; }
.card-t { margin: 0; font-size: 14.5px; font-weight: 600; }
.card-s { margin: 2px 0 0; font-size: 12.5px; color: var(--fg-3); }
.card-b { padding: 6px 16px 16px; min-width: 0; }
.card-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kpi { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.kpi-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); font-weight: 600; }
.kpi-value { font: 600 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-3); }
.kpi-spark { height: 36px; margin-top: 2px; }
.kpi-name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.insights li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.ins-ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ins-ico.up { background: var(--up-soft); color: var(--up); }
.ins-ico.down { background: var(--down-soft); color: var(--down); }
.ins-ico.info { background: var(--accent-soft); color: var(--accent); }
.ins-ico.warn { background: var(--surface-3); color: var(--fg-2); }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px;
  border: 1px dashed var(--accent); border-radius: var(--r); background: var(--accent-soft); color: var(--fg); }
.banner b { color: var(--accent); }

/* ---------- графики ---------- */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--fg-3); font: 11px var(--f-body); }
.chart .axis-num { font-family: var(--f-mono); font-size: 10.5px; }
.chart .lbl-strong { fill: var(--fg); font-weight: 600; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .zero-l { stroke: var(--fg-3); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); margin: 2px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { background-image: linear-gradient(90deg, currentColor 55%, transparent 55%) !important; background-size: 5px 3px; }
.tip {
  position: fixed; z-index: 100; pointer-events: none; padding: 8px 10px; border-radius: 8px; background: var(--fg); color: var(--bg);
  font-size: 12px; line-height: 1.4; box-shadow: var(--shadow); max-width: 300px;
}
.tip .t-h { font-weight: 600; margin-bottom: 3px; }
.tip .t-r { display: flex; justify-content: space-between; gap: 14px; }
.tip .t-r b { font-family: var(--f-mono); font-weight: 600; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-3); }

/* ---------- таблицы ---------- */
.tbl-wrap { overflow: auto; max-height: 70vh; border-top: 1px solid var(--line); }
table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
.tbl th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--fg-3); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; user-select: none; }
.tbl th.nosort { cursor: default; }
.tbl th:hover:not(.nosort) { color: var(--fg); }
.tbl th .arr { color: var(--accent); }
.tbl td.l, .tbl th.l { text-align: left; }
.tbl td.pos { position: sticky; left: 0; z-index: 1; background: var(--surface); max-width: 280px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tbl th.pos { left: 0; z-index: 3; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.grp td { background: var(--surface-2); font-weight: 600; cursor: default; }
.tbl tr.tot td { font-weight: 700; border-top: 2px solid var(--line); background: var(--surface); position: sticky; bottom: 0; }
.tbl td .num { font-size: 12.5px; }
.bar-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.share-bar { width: 52px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.share-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* тепловая карта */
.hm-wrap { overflow: auto; max-height: 72vh; }
table.hm { border-collapse: separate; border-spacing: 2px; font-size: 11px; }
.hm th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--fg-3); font-weight: 500; padding: 4px 2px; white-space: nowrap; font-size: 10.5px; }
.hm td { min-width: 46px; height: 24px; text-align: center; border-radius: 4px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 10.5px; padding: 0 3px; }
.hm td.nm { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-family: var(--f-body); font-size: 12px; color: var(--fg); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; cursor: pointer; }
.hm th.nm { left: 0; z-index: 3; }
.hm-scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg-3); }
.hm-scale .ramp { width: 160px; height: 8px; border-radius: 4px; }

/* данные */
.drop {
  border: 2px dashed var(--line); border-radius: 12px; padding: 26px 18px; text-align: center; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 10px; transition: border-color .15s, background .15s;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h3 { margin: 0; font: 600 17px var(--f-display); }
.drop p { margin: 0; color: var(--fg-2); max-width: 60ch; }
.drop-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.map-col { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.map-col .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-col .ex { font-size: 11.5px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-mono); }
.preview-wrap { overflow: auto; max-height: 260px; border: 1px solid var(--line); border-radius: 8px; }
.preview { border-collapse: collapse; font-size: 12px; }
.preview td, .preview th { border-bottom: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; text-align: left; }
.preview th { background: var(--surface-2); position: sticky; top: 0; }
.steps { display: flex; flex-wrap: wrap; gap: 10px; counter-reset: s; margin: 0; padding: 0; list-style: none; }
.steps li { counter-increment: s; display: flex; gap: 8px; align-items: center; color: var(--fg-2); font-size: 13px; }
.steps li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--fg); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.alert { padding: 10px 12px; border-radius: 8px; background: var(--down-soft); color: var(--fg); border: 1px solid var(--down); }
.okmsg { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); }

/* формула */
.formula-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.metric-chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.metric-chip:hover { border-color: var(--accent); color: var(--accent); }
.op-chip { min-width: 30px; }
.slider-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(0, 2fr) 70px; gap: 10px; align-items: center; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
.slider-row .val { font-family: var(--f-mono); text-align: right; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 9px 14px; border-radius: 8px; z-index: 200; box-shadow: var(--shadow); font-weight: 500; }

@media (max-width: 1100px) { .g-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); gap: 2px; }
  .brand { padding: 0 8px 0 0; }
  .brand-name small, .nav-sep, .rail-foot { display: none; }
  .nav-btn { width: auto; white-space: nowrap; padding: 7px 9px; }
  .toolbar { position: static; padding: 10px 16px; }
  .content { padding: 16px 16px 40px; }
  .g-2e { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Разделы">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"></rect>
        <polyline points="6,20 11,20 14,10 18,24 21,15 26,15" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>
      <div class="brand-name">Fiber Pulse<small>динамика позиций</small></div>
    </div>
    <button class="nav-btn" data-view="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Обзор</button>
    <button class="nav-btn" data-view="table"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18M9 3v18"/></svg>Позиции</button>

async function readFileToGrid(file) {

function parseDelimited(text) {

    if (!counts.length) continue;

async function inflateRaw(data) {

/* --- прогноз: сезонность + тренд (или Холт с затуханием) --- */
function forecastSeries(y, h, season) {
  const first = y.findIndex(isNum); if (first < 0) return null;
  if (!isNum(y[y.length - 1])) return null;               // позиция выбыла — не прогнозируем
  const s = y.slice(first); const n = s.length;
  if (n < 4) return null;
  for (let i = 1; i < n; i++) if (!isNum(s[i])) s[i] = s[i - 1];   // пропуски внутри ряда — последним значением
  const lin = (arr) => { const m = arr.length, mx = (m - 1) / 2, my = mean(arr); let sxy = 0, sxx = 0; arr.forEach((v, i) => { sxy += (i - mx) * (v - my); sxx += (i - mx) ** 2; }); const b = sxx ? sxy / sxx : 0; return { a: my - b * mx, b }; };
  let fit = [], fc = [], method;
  if (season > 1 && n >= 2 * season) {
    method = "сезонность + тренд";
    const tr = lin(s); const mult = s.every(v => v > 0) && tr.a > 0 && tr.a + tr.b * (n - 1) > 0;
    const idx = new Array(season).fill(0).map(() => []);
    s.forEach((v, i) => { const t = tr.a + tr.b * i; idx[i % season].push(mult ? v / t : v - t); });
    let si = idx.map(mean); const norm = mean(si); si = si.map(v => mult ? v / norm : v - norm);
    const des = s.map((v, i) => mult ? v / si[i % season] : v - si[i % season]);
    const w = Math.min(n, season * 3); const tr2 = lin(des.slice(n - w)); const off = n - w;
    const val = i => { const t = tr2.a + tr2.b * (i - off); return mult ? t * si[i % season] : t + si[i % season]; };
    fit = s.map((_, i) => val(i)); for (let i = n; i < n + h; i++) fc.push(val(i));
  } else {
    method = "тренд (Холт)";
    const al = 0.5, be = 0.2, ph = 0.9; let lv = s[0], tr = s[1] - s[0];
    fit.push(s[0]);
    for (let i = 1; i < n; i++) { fit.push(lv + ph * tr); const nl = al * s[i] + (1 - al) * (lv + ph * tr); tr = be * (nl - lv) + (1 - be) * ph * tr; lv = nl; }
    let dampSum = 0; for (let k = 1; k <= h; k++) { dampSum += ph ** k; fc.push(lv + dampSum * tr); }
  }
  const res = s.map((v, i) => v - fit[i]).slice(season > 1 ? Math.min(season, Math.floor(n / 3)) : 1);
  const sd = Math.sqrt(mean(res.map(r => r * r))) || 0;
  const lo = fc.map((v, k) => v - 1.28 * sd * Math.sqrt(1 + k * 0.25)), hi = fc.map((v, k) => v + 1.28 * sd * Math.sqrt(1 + k * 0.25));
  return { fc, lo, hi, method, sd, first };
}

function runFactors() {
  const msg = $("#fa-msg"), wf = $("#fa-wf .card-b"), tb = $("#fa-pos .card-b");
  if (!S.factor.formula.trim()) { msg.innerHTML = `<div class="muted">Соберите формулу, например <b>[Объём] × [Цена]</b> — и увидите, сколько изменения дал объём, а сколько цена.</div>`; wf.innerHTML = tb.innerHTML = `<div class="empty">Ждём формулу</div>`; saveState(); return; }
  let f; try { f = compileFormula(S.factor.formula, allMetricNames()); } catch (e) { msg.innerHTML = `<div class="alert">${esc(e.message)}</div>`; wf.innerHTML = tb.innerHTML = ""; return; }
  saveState();
  // значения факторов в периодах A и B по позициям
  const prs = f.vars.map(m => { const save = S.metric; S.metric = m; const pr = comparePair(m); S.metric = save; return pr; });
  if (!prs[0].a) { msg.innerHTML = `<div class="alert">Для «${esc(prs[0].la)}» нет данных. Выберите другое сравнение сверху.</div>`; wf.innerHTML = tb.innerHTML = ""; return; }
  const P = visiblePos(); const k = f.vars.length;
  const eff = new Array(k).fill(0); let Ya = 0, Yb = 0, newE = 0, goneE = 0, skipped = 0; const perPos = [];
  for (const p of P) {
    const xa = prs.map(pr => pr.a[p]), xb = prs.map(pr => pr.b[p]);
    const okA = xa.every(isNum), okB = xb.every(isNum);
    if (!okA && !okB) continue;
    if (okA && !okB) { const y = f.fn(xa); if (isNum(y)) { goneE -= y; Ya += y; } continue; }
    if (!okA && okB) { const y = f.fn(xb); if (isNum(y)) { newE += y; Yb += y; } continue; }
    const r = factorDecompose(f, xa, xb, S.factor.method);
    if (!r) { skipped++; continue; }
    Ya += r.ya; Yb += r.yb; r.eff.forEach((e, i) => eff[i] += e); perPos.push({ p, ...r, d: r.yb - r.ya });
  }
  const resName = (() => { const m = S.factor.formula; const hit = suggestFormulas().find(s => s.text === m); return hit ? hit.y : "Результат"; })();
  const lin = f.vars.length === 1;
  msg.innerHTML = `<div class="okmsg">${esc(resName)}: <b>${fmtC(Ya)}</b> (${esc(prs[0].la)}) → <b>${fmtC(Yb)}</b> (${esc(prs[0].lb)}), изменение <b>${fmtS(Yb - Ya)}</b> (${fmtP(pctCh(Yb, Ya))}). Сумма вкладов сходится с изменением${skipped ? `; ${skipped} поз. пропущено (деление на ноль)` : ""}.${f.vars.some(v => metricInfo(v).agg === "avg") && S.g !== DS.base ? " Для цен на укрупнённом шаге берётся среднее за период." : ""}</div>`;
  const steps = [{ name: prs[0].la, v: Ya, total: true }, ...f.vars.map((v, i) => ({ name: v, v: eff[i], tip: `<div class="t-r"><span>Доля в изменении</span><b>${Yb - Ya ? nf(0).format(eff[i] / (Yb - Ya) * 100) + "%" : "—"}</b></div>` }))];
  if (newE) steps.push({ name: "Новые позиции", v: newE }); if (goneE) steps.push({ name: "Выбывшие позиции", v: goneE });
  steps.push({ name: prs[0].lb, v: Yb, total: true });
  waterfall(wf, steps, { height: 300 });
  // таблица позиций
  perPos.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  const rows = perPos.slice(0, 40).map(r => `<tr data-p="${r.p}"><td class="l pos" title="${esc(DS.positions[r.p].name)}">${esc(DS.positions[r.p].name)}</td><td class="num">${fmtS(r.d)}</td>${r.eff.map(e => `<td class="num" style="color:${e >= 0 ? "var(--up)" : "var(--down)"}">${fmtS(e)}</td>`).join("")}</tr>`).join("");
  tb.innerHTML = `<div class="tbl-wrap" style="max-height:330px"><table class="tbl"><thead><tr><th class="l pos nosort">Позиция</th><th class="nosort">Δ итог</th>${f.vars.map(v => `<th class="nosort">${esc(v)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  $$("tr[data-p]", tb).forEach(r => r.onclick = () => { S.detailPos = +r.dataset.p; go("detail"); });
}

      <p class="muted" style="margin:10px 0 0;font-size:12.5px">Периоды понимаются в любом виде: «янв 2025», «Январь 2025», «2025-01», «01.2025», «15.01.2025», «I кв 2025», «2025». Числа: «1 234,5», «12,5%», «(1 234)». Дни собираются в месяцы автоматически.</p>`)}
    ${cardHTML("ds-now", "Сейчас загружено", "", "", dsSummary())}
  </div>`);
  c.insertAdjacentHTML("beforeend", cardHTML("ds-derived", "Расчётные показатели", "Добавьте свой показатель по формуле — например, маржа = [Выручка] − [Себестоимость] или средний чек = [Выручка] ÷ [Чеки]. Он появится во всех разделах.", "", derivedHTML()));
  renderPending();
  $("#pick").onclick = () => $("#file-input").click();
  $("#demo1").onclick = () => { PENDING = null; setDS(demoSales()); go("overview"); };
  $("#demo2").onclick = () => { PENDING = null; setDS(demoBudget()); go("overview"); };
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev => { const f = ev.dataTransfer.files[0]; if (f) loadFile(f); });
  bindDerived(c); bindDsTools(c);
};
function dsSummary() {
  const m = allMetricNames().map(n => `<span class="tag">${esc(n)} · ${metricInfo(n).agg === "avg" ? "среднее" : "сумма"}</span>`).join(" ");
  return `<div style="display:flex;flex-direction:column;gap:8px">
    <div><b>${esc(DS.name)}</b>${DS.demo ? ' <span class="chip new">пример</span>' : ""}</div>
    <div class="dim">${DS.positions.length} позиций${groups().length ? ` в ${groups().length} группах` : ""} · периоды: ${pLabel(DS.keys[0], DS.base)} — ${pLabel(DS.keys[DS.keys.length - 1], DS.base)} (${DS.keys.length}, шаг — ${GNAME[DS.base]})</div>
    <div>${m}</div>
    <p class="muted" style="margin:0;font-size:12.5px">«Сумма» — показатель складывается при переходе к кварталам и годам и по позициям (выручка, затраты, штуки). «Среднее» — усредняется (цены, доли, ставки). Щёлкните показатель, чтобы переключить.</p>
    ${DS.bad && DS.bad.length ? `<div class="alert">Пропущены нечисловые значения: ${DS.bad.map(esc).join(", ")}${DS.bad.length >= 5 ? "…" : ""}</div>` : ""}
    ${DS.dup ? `<div class="muted" style="font-size:12.5px">Повторяющихся строк сложено (или усреднено): ${DS.dup}</div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="ds-export">Скачать данные (CSV)</button>${!DS.demo ? `<button class="btn sm" id="ds-forget">Удалить из памяти браузера</button>` : ""}</div>
  </div>`;
}
function bindDsTools(c) {
  $$("#ds-now .tag", c).forEach((t, i) => { t.style.cursor = "pointer"; t.title = "Переключить сумма/среднее"; t.onclick = () => { const n = allMetricNames()[i]; const m = metricInfo(n); m.agg = m.agg === "avg" ? "sum" : "avg"; clearCache(); saveDS(); render(); }; });
  const ex = $("#ds-export"); if (ex) ex.onclick = () => {
    const lines = [["Позиция", "Группа", "Период", ...allMetricNames()].join(";")];
    DS.positions.forEach((p, i) => DS.keys.forEach((k, t) => { const vals = allMetricNames().map(m => baseSeries(m)[i * DS.keys.length + t]); if (vals.some(isNum)) lines.push([p.name, p.group, pLabel(k, DS.base), ...vals.map(v => isNum(v) ? String(v).replace(".", ",") : "")].map(s => /[;"]/.test(s) ? '"' + String(s).replace(/"/g, '""') + '"' : s).join(";")); }));
    download(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv" }), "данные_fiber_pulse.csv");
  };
  const fg = $("#ds-forget"); if (fg) fg.onclick = () => { store.del("ds"); setDS(demoSales()); toast("Данные удалены из памяти браузера, открыт пример"); };
}
function derivedHTML() {
  const list = DS.derived.map((d, i) => `<div class="formula-row"><span class="tag">${esc(d.name)}</span><span class="mono" style="font-size:12.5px">= ${esc(d.formula)}</span><button class="btn ghost sm" data-deldv="${i}">Удалить</button></div>`).join("");
  return `<div style="display:flex;flex-direction:column;gap:10px">${list}
    <div class="formula-row"><input class="input" id="dv-name" placeholder="Название, напр. Маржа" style="width:200px"><b>=</b><input class="input" id="dv-formula" placeholder="[Выручка] − [Себестоимость]" style="flex:1;min-width:220px">
    <select class="select" id="dv-agg"><option value="sum">складывать</option><option value="avg">усреднять</option></select><button class="btn primary sm" id="dv-add">Добавить</button></div>
    <div class="formula-row">${allMetricNames().map(n => `<button class="metric-chip" data-dvins="[${esc(n)}]">${esc(n)}</button>`).join("")}${["×", "÷", "+", "−", "(", ")"].map(o => `<button class="metric-chip op-chip" data-dvins=" ${o} ">${o}</button>`).join("")}</div>
    <div id="dv-msg"></div></div>`;
}
function bindDerived(c) {
  $$("[data-dvins]", c).forEach(b => b.onclick = () => { const inp = $("#dv-formula"); const s = inp.selectionStart ?? inp.value.length; inp.value = inp.value.slice(0, s) + b.dataset.dvins + inp.value.slice(inp.selectionEnd ?? s); inp.focus(); });
  $$("[data-deldv]", c).forEach(b => b.onclick = () => { DS.derived.splice(+b.dataset.deldv, 1); clearCache(); if (!allMetricNames().includes(S.metric)) S.metric = allMetricNames()[0]; saveDS(); render(); });
  $("#dv-add").onclick = () => {
    const name = $("#dv-name").value.trim(), formula = $("#dv-formula").value.trim();
    try {
      if (!name) throw new Error("Введите название показателя.");
      if (allMetricNames().includes(name)) throw new Error("Показатель с таким названием уже есть.");
      compileFormula(formula, allMetricNames());
      DS.derived.push({ name, formula, agg: $("#dv-agg").value, _cache: null }); clearCache(); saveDS(); render(); toast(`Показатель «${name}» добавлен`);
    } catch (e) { $("#dv-msg").innerHTML = `<div class="alert">${esc(e.message)}</div>`; }
  };
}
async function loadFile(file) {
  try {
    toast("Читаю «" + file.name + "»…", 1500);
    const wb = await readFileToGrid(file);
    PENDING = { name: file.name.replace(/\.[^.]+$/, ""), sheets: wb.sheets, sheet: 0 };
    prepPending();
  } catch (e) { PENDING = { error: e.message }; }
  if (S.view !== "data") go("data"); else renderPending();
}
function loadGrid(grid, name) { PENDING = { name, sheets: [{ name: "Вставка", grid }], sheet: 0 }; prepPending(); if (S.view !== "data") go("data"); else renderPending(); }
function prepPending() {
  const sh = PENDING.sheets[PENDING.sheet];
  try { PENDING.layout = detectLayout(sh.grid); PENDING.error = null; } catch (e) { PENDING.layout = null; PENDING.error = e.message; }
}
function renderPending() {
  const host = $("#pending"); if (!host) return;
  if (!PENDING) { host.innerHTML = ""; return; }
  if (PENDING.error && !PENDING.layout) { host.innerHTML = `<div class="alert"><b>Не получилось разобрать таблицу.</b> ${esc(PENDING.error)}</div>`; return; }
  const L = PENDING.layout; const wide = L.roles.includes("pcol");
  const roleOpts = (i) => {
    const allowed = wide ? ["pos", "group", "metricName", "pcol", "skip"] : ["pos", "group", "metricName", "period", "value", "year", "month", "skip"];
    return allowed.map(r => `<option value="${r}" ${L.roles[i] === r ? "selected" : ""}>${{ ...ROLE_NAMES, year: "Год", month: "Месяц" }[r]}</option>`).join("");
  };
  const nPer = L.roles.filter(r => r === "pcol").length;
  const visCols = L.cols.filter(cc => !(wide && L.roles[cc.i] === "pcol"));
  const metricNameInput = wide && !L.roles.includes("metricName");
  host.innerHTML = cardHTML("pend", `Проверьте: «${esc(PENDING.name)}»`, wide ? `Распознано: <b>позиции в строках, ${nPer} периодов в столбцах</b> (${esc(L.header[L.roles.indexOf("pcol")])} … ${esc(L.header[L.roles.lastIndexOf("pcol")])})` : `Распознано: <b>длинная таблица</b> — строка = позиция + период`,
    PENDING.sheets.length > 1 ? `<select class="select" id="pend-sheet">${PENDING.sheets.map((s, i) => `<option value="${i}" ${i === PENDING.sheet ? "selected" : ""}>Лист: ${esc(s.name)}</option>`).join("")}</select>` : "",
    `<div style="display:flex;flex-direction:column;gap:12px">
      <ol class="steps"><li>Проверьте роли столбцов</li><li>${metricNameInput ? "Назовите показатель" : "Проверьте показатели"}</li><li>Нажмите «Загрузить»</li></ol>
      <div class="map-grid">${visCols.map(cc => `<div class="map-col"><span class="nm" title="${esc(cc.name)}">${esc(cc.name)}</span><span class="ex">${esc(cc.example || "—")}</span><select class="select" data-role="${cc.i}">${roleOpts(cc.i)}</select></div>`).join("")}</div>
      ${metricNameInput ? `<div class="formula-row"><label for="pend-mname"><b>Что за числа в таблице?</b></label><input class="input" id="pend-mname" value="${esc(PENDING.mname || guessMetricName(PENDING.name))}" style="width:240px"><span class="muted" style="font-size:12.5px">например: Выручка, руб. · Затраты · Объём, шт.</span></div>` : ""}
      <div class="preview-wrap"><table class="preview"><tr>${L.header.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${L.rows.slice(0, 8).map(r => `<tr>${L.header.map((_, i) => `<td>${esc(cellText(r[i]))}</td>`).join("")}</tr>`).join("")}</table></div>
      <div id="pend-msg"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="pend-ok">Загрузить данные</button><button class="btn" id="pend-cancel">Отмена</button><span class="muted" style="align-self:center;font-size:12.5px">${L.rows.length} строк</span></div>
    </div>`);
  $$("[data-role]", host).forEach(s => s.onchange = () => { L.roles[+s.dataset.role] = s.value; renderPending(); });
  const sh = $("#pend-sheet"); if (sh) sh.onchange = () => { PENDING.sheet = +sh.value; prepPending(); renderPending(); };
  const mn = $("#pend-mname"); if (mn) mn.oninput = () => PENDING.mname = mn.value;
  $("#pend-cancel").onclick = () => { PENDING = null; renderPending(); };
  $("#pend-ok").onclick = () => {
    try {
      if (!L.roles.includes("pos")) throw new Error("Выберите столбец с позициями (роль «Позиция»).");
      const ds = buildDataset(L, { name: PENDING.name, metricName: (mn && mn.value.trim()) || "Значение" });
      PENDING = null; setDS(ds); go("overview");
      toast(`Загружено: ${ds.positions.length} позиций, ${ds.keys.length} периодов`);
    } catch (e) { $("#pend-msg").innerHTML = `<div class="alert">${esc(e.message)}</div>`; }
  };
  host.scrollIntoView({ behavior: "smooth", block: "start" });
}
function guessMetricName(file) { return /затрат|расход|бюджет|cost|opex/i.test(file) ? "Затраты" : /выручк|продаж|sales|revenue/i.test(file) ? "Выручка" : "Значение"; }

/* ---------------------------- события ---------------------------- */
function bindGlobal() {
  $$(".nav-btn").forEach(b => b.onclick = () => go(b.dataset.view));
  $("#tb-metric").onchange = e => { S.metric = e.target.value; render(); };
  $$("#tb-gran button").forEach(b => b.onclick = () => { if (b.disabled) return; const A0 = agg(S.metric, S.g); const k = A0.keys[S.t]; S.g = b.dataset.g; const A1 = agg(S.metric, S.g); const i = A1.keys.indexOf(gKey(k, S.g)); S.t = i >= 0 ? i : A1.keys.length - 1; S.customT = -1; render(); });
  $("#tb-period").onchange = e => { S.t = +e.target.value; render(); };
  $("#tb-prev").onclick = () => { if (S.t > 0) { S.t--; render(); } };
  $("#tb-next").onclick = () => { const n = agg(S.metric, S.g).keys.length; if (S.t < n - 1) { S.t++; render(); } };
  $$("#tb-cmp button").forEach(b => b.onclick = () => { S.cmp = b.dataset.c; render(); });
  $("#tb-custom").onchange = e => { S.customT = +e.target.value; render(); };
  $("#tb-group").onchange = e => { S.group = e.target.value; render(); };
  $("#file-input").onchange = e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ""; };
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => { if (e.target.closest && e.target.closest("#drop")) return; e.preventDefault(); const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) loadFile(f); });
  document.addEventListener("paste", e => {
    if (e.target.matches && e.target.matches("input, textarea")) return;
    const text = e.clipboardData && e.clipboardData.getData("text/plain");
    if (!text || !/\t/.test(text)) { if (text) toast("Скопируйте таблицу прямо из Excel — со столбцами"); return; }
    e.preventDefault(); loadGrid(parseDelimited(text), "Таблица из буфера обмена");
  });
  document.addEventListener("keydown", e => {
    if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft") $("#tb-prev").click(); else if (e.key === "ArrowRight") $("#tb-next").click();
  });
  $$("[data-theme-set]").forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet); });
  // перерисовка только при изменении ширины (высота меняется от самой перерисовки)
  let rt, lastW = 0;
  new ResizeObserver(en => { const w = Math.round(en[0].contentRect.width); if (Math.abs(w - lastW) < 8) return; const first = !lastW; lastW = w; if (first) return;
    clearTimeout(rt); rt = setTimeout(() => { if (DS && !document.activeElement.matches("input, select, textarea")) render(); }, 180); }).observe($("#content"));
}
function setTheme(t, initial) {
  if (t === "auto") { if (!initial) document.documentElement.removeAttribute("data-theme"); } else document.documentElement.setAttribute("data-theme", t);
  $$("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
  store.set("theme", t); if (DS) render();
}

/* ---------------------------- запуск ---------------------------- */
(function boot() {
  refreshFonts();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { refreshFonts(); if (DS) render(); });
  setTheme(store.get("theme", "auto"), true);
  const st = store.get("state", null);
  if (st) Object.assign(S, st, { factor: { ...S.factor, ...(st.factor || {}) } });
  bindGlobal();
  const saved = store.get("ds", null);
  if (saved && saved.keys && saved.positions && saved.data) {
    try { setDS({ ...saved, data: saved.data, derived: saved.derived || [] }, true); return; } catch (e) { store.del("ds"); }
  }
  setDS(demoSales());
})();
</script>
