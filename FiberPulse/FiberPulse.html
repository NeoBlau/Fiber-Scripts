<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiber Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: «пульт аналитика» — левая навигация, сверху полоса глобальных переключателей,
   справа плотные рабочие панели. Цвет изменения: синий = рост, красный = падение (безопасно для дальтоников). */
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --surface-3: #e3e8f0;
  --line: #d9dfe8;
  --fg: #12161c;
  --fg-2: #485263;
  --fg-3: #7a8496;
  --accent: #0e6f68;
  --accent-ink: #ffffff;
  --accent-soft: #d8efec;
  --up: #2a78d6;
  --down: #d93f3f;
  --up-soft: #dbe9fb;
  --down-soft: #fbdede;
  --total: #5d6879;
  --mid: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --shadow: 0 1px 2px rgba(18, 22, 28, .06), 0 4px 16px rgba(18, 22, 28, .05);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1115; --surface: #161a20; --surface-2: #1c2129; --surface-3: #252b35; --line: #2b323d;
    --fg: #eef1f5; --fg-2: #b2bccb; --fg-3: #7f8a9b;
    --accent: #2bb5a6; --accent-ink: #062320; --accent-soft: #123532;
    --up: #3987e5; --down: #e66767; --up-soft: #16283f; --down-soft: #3a1c1e; --total: #8f9aac; --mid: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1115; --surface: #161a20; --surface-2: #1c2129; --surface-3: #252b35; --line: #2b323d;
  --fg: #eef1f5; --fg-2: #b2bccb; --fg-3: #7f8a9b;
  --accent: #2bb5a6; --accent-ink: #062320; --accent-soft: #123532;
  --up: #3987e5; --down: #e66767; --up-soft: #16283f; --down-soft: #3a1c1e; --total: #8f9aac; --mid: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 16px rgba(0, 0, 0, .25);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- каркас ---------- */
.app { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 100%; }
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 4px; padding: 18px 12px; border-right: 1px solid var(--line);
  background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .01em; line-height: 1.1; }
.brand-name small { display: block; font: 500 10.5px/1.2 var(--f-body); color: var(--fg-3); letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--fg-2); cursor: pointer; text-align: left; font-weight: 500;
}
.nav-btn svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 6px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 0; }
.rail-foot .muted { font-size: 12px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.tb-group { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tb-label { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
.content { padding: 22px 24px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* ---------- элементы управления ---------- */
.select, .input {
  height: 34px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  min-width: 0; max-width: 100%;
}
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%);
  background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px; background-size: 5px 5px; background-repeat: no-repeat; cursor: pointer; }
.input { padding: 0 10px; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--fg-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn { width: 34px; padding: 0; }
.period-nav { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.period-nav button { border: 0; background: transparent; width: 30px; height: 32px; cursor: pointer; color: var(--fg-2); font-size: 16px; }
.period-nav button:hover { color: var(--fg); }
.period-nav select { border: 0; height: 32px; background: transparent; font-weight: 600; padding: 0 4px; cursor: pointer; max-width: 150px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.chip.flat { background: var(--surface-2); color: var(--fg-3); }
.chip.new { background: var(--accent-soft); color: var(--accent); font-family: var(--f-body); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--fg-2); font-size: 11.5px; }
.muted { color: var(--fg-3); }
.dim { color: var(--fg-2); }

/* ---------- панели ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 18px; }
.page-title { margin: 0; font: 600 22px/1.15 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.page-sub { margin: 4px 0 0; color: var(--fg-2); max-width: 70ch; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.g-2 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
.g-2e { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 14px 16px 6px; }
.card-t { margin: 0; font-size: 14.5px; font-weight: 600; }
.card-s { margin: 2px 0 0; font-size: 12.5px; color: var(--fg-3); }
.card-b { padding: 6px 16px 16px; min-width: 0; }
.card-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kpi { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.kpi-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-3); font-weight: 600; }
.kpi-value { font: 600 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--fg-3); }
.kpi-spark { height: 36px; margin-top: 2px; }
.kpi-name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.insights li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
.ins-ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ins-ico.up { background: var(--up-soft); color: var(--up); }
.ins-ico.down { background: var(--down-soft); color: var(--down); }
.ins-ico.info { background: var(--accent-soft); color: var(--accent); }
.ins-ico.warn { background: var(--surface-3); color: var(--fg-2); }

.banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px;
  border: 1px dashed var(--accent); border-radius: var(--r); background: var(--accent-soft); color: var(--fg); }
.banner b { color: var(--accent); }

/* ---------- графики ---------- */
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--fg-3); font: 11px var(--f-body); }
.chart .axis-num { font-family: var(--f-mono); font-size: 10.5px; }
.chart .lbl-strong { fill: var(--fg); font-weight: 600; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .zero-l { stroke: var(--fg-3); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--fg-2); margin: 2px 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dash { background-image: linear-gradient(90deg, currentColor 55%, transparent 55%) !important; background-size: 5px 3px; }
.tip {
  position: fixed; z-index: 100; pointer-events: none; padding: 8px 10px; border-radius: 8px; background: var(--fg); color: var(--bg);
  font-size: 12px; line-height: 1.4; box-shadow: var(--shadow); max-width: 300px;
}
.tip .t-h { font-weight: 600; margin-bottom: 3px; }
.tip .t-r { display: flex; justify-content: space-between; gap: 14px; }
.tip .t-r b { font-family: var(--f-mono); font-weight: 600; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-3); }

/* ---------- таблицы ---------- */
.tbl-wrap { overflow: auto; max-height: 70vh; border-top: 1px solid var(--line); }
table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
.tbl th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--fg-3); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; user-select: none; }
.tbl th.nosort { cursor: default; }
.tbl th:hover:not(.nosort) { color: var(--fg); }
.tbl th .arr { color: var(--accent); }
.tbl td.l, .tbl th.l { text-align: left; }
.tbl td.pos { position: sticky; left: 0; z-index: 1; background: var(--surface); max-width: 280px; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tbl th.pos { left: 0; z-index: 3; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.grp td { background: var(--surface-2); font-weight: 600; cursor: default; }
.tbl tr.tot td { font-weight: 700; border-top: 2px solid var(--line); background: var(--surface); position: sticky; bottom: 0; }
.tbl td .num { font-size: 12.5px; }
.bar-cell { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.share-bar { width: 52px; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.share-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* тепловая карта */
.hm-wrap { overflow: auto; max-height: 72vh; }
table.hm { border-collapse: separate; border-spacing: 2px; font-size: 11px; }
.hm th { position: sticky; top: 0; z-index: 2; background: var(--surface); color: var(--fg-3); font-weight: 500; padding: 4px 2px; white-space: nowrap; font-size: 10.5px; }
.hm td { min-width: 46px; height: 24px; text-align: center; border-radius: 4px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 10.5px; padding: 0 3px; }
.hm td.nm { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; font-family: var(--f-body); font-size: 12px; color: var(--fg); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; cursor: pointer; }
.hm th.nm { left: 0; z-index: 3; }
.hm-scale { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--fg-3); }
.hm-scale .ramp { width: 160px; height: 8px; border-radius: 4px; }

/* данные */
.drop {
  border: 2px dashed var(--line); border-radius: 12px; padding: 26px 18px; text-align: center; background: var(--surface);
  display: flex; flex-direction: column; align-items: center; gap: 10px; transition: border-color .15s, background .15s;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h3 { margin: 0; font: 600 17px var(--f-display); }
.drop p { margin: 0; color: var(--fg-2); max-width: 60ch; }
.drop-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.map-col { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.map-col .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-col .ex { font-size: 11.5px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-mono); }
.preview-wrap { overflow: auto; max-height: 260px; border: 1px solid var(--line); border-radius: 8px; }
.preview { border-collapse: collapse; font-size: 12px; }
.preview td, .preview th { border-bottom: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; text-align: left; }
.preview th { background: var(--surface-2); position: sticky; top: 0; }
.steps { display: flex; flex-wrap: wrap; gap: 10px; counter-reset: s; margin: 0; padding: 0; list-style: none; }
.steps li { counter-increment: s; display: flex; gap: 8px; align-items: center; color: var(--fg-2); font-size: 13px; }
.steps li::before { content: counter(s); width: 20px; height: 20px; border-radius: 50%; background: var(--surface-3); color: var(--fg); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.alert { padding: 10px 12px; border-radius: 8px; background: var(--down-soft); color: var(--fg); border: 1px solid var(--down); }
.okmsg { padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); border: 1px solid var(--accent); }

/* формула */
.formula-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.metric-chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.metric-chip:hover { border-color: var(--accent); color: var(--accent); }
.op-chip { min-width: 30px; }
.slider-row { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(0, 2fr) 70px; gap: 10px; align-items: center; }
.slider-row input[type=range] { width: 100%; accent-color: var(--accent); }
.slider-row .val { font-family: var(--f-mono); text-align: right; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 9px 14px; border-radius: 8px; z-index: 200; box-shadow: var(--shadow); font-weight: 500; }

@media (max-width: 1100px) { .g-2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); gap: 2px; }
  .brand { padding: 0 8px 0 0; }
  .brand-name small, .nav-sep, .rail-foot { display: none; }
  .nav-btn { width: auto; white-space: nowrap; padding: 7px 9px; }
  .toolbar { position: static; padding: 10px 16px; }
  .content { padding: 16px 16px 40px; }
  .g-2e { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Разделы">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"></rect>
        <polyline points="6,20 11,20 14,10 18,24 21,15 26,15" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></polyline>
      </svg>
      <div class="brand-name">Fiber Pulse<small>динамика позиций</small></div>
    </div>
    <button class="nav-btn" data-view="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Обзор</button>
    <button class="nav-btn" data-view="table"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18M9 3v18"/></svg>Позиции</button>

async function readFileToGrid(file) {

function parseDelimited(text) {

async function inflateRaw(data) {

// Вклад позиций в изменение итога + разбивка «рост/падение/новые/выбывшие»
function movers(pair, P = visiblePos()) {
  const out = [];
  for (const p of P) {
    const a = pair.a ? pair.a[p] : NaN, b = pair.b[p];
    if (!isNum(a) && !isNum(b)) continue;
    const st = !isNum(a) ? "new" : !isNum(b) ? "gone" : "both";
    const d = (isNum(b) ? b : 0) - (isNum(a) ? a : 0);
    out.push({ p, name: DS.positions[p].name, a, b, d, pct: st === "both" ? pctCh(b, a) : NaN, st });
  }
  return out;
}
function zScoreLatest(series, t) { // аномалия: изменение последнего периода против истории изменений
  const ch = []; for (let i = 1; i <= t; i++) { const c = pctCh(series[i], series[i - 1]); if (isNum(c)) ch.push(c); }
  if (ch.length < 8) return NaN;
  const last = ch[ch.length - 1], hist = ch.slice(0, -1); const m = mean(hist), sd = Math.sqrt(mean(hist.map(v => (v - m) ** 2)));
  return sd > 0 ? (last - m) / sd : NaN;
}
function insights(pair, mv, tot) {
  const L = [];
  const A = pair.A, info = metricInfo(S.metric);
  const ta = pair.a ? (A.agg === "avg" ? mean(visiblePos().map(p => pair.a[p])) : sum(visiblePos().map(p => pair.a[p]))) : NaN;
  const tb = A.agg === "avg" ? mean(visiblePos().map(p => pair.b[p])) : sum(visiblePos().map(p => pair.b[p]));
  if (isNum(ta)) {
    const p = pctCh(tb, ta);
    L.push({ k: p >= 0 ? "up" : "down", ico: p >= 0 ? "▲" : "▼", html: `${info.agg === "avg" ? "Среднее" : "Итого"} за <b>${esc(pair.lb)}</b>: ${fmtC(tb)} — ${p >= 0 ? "рост" : "снижение"} на <b>${fmtP(p)}</b> (${fmtS(tb - ta)}) ${pair.ytd ? "к тому же отрезку прошлого года" : "к " + esc(pair.la)}.` });
  } else L.push({ k: "info", ico: "i", html: `Для «${esc(pair.la)}» нет данных — сравнивать не с чем. Выберите другой режим сравнения.` });
  const both = mv.filter(m => m.st === "both");
  const up = both.filter(m => m.d > 0).sort((a, b) => b.d - a.d), dn = both.filter(m => m.d < 0).sort((a, b) => a.d - b.d);
  if (up.length) L.push({ k: "up", ico: "↑", html: `Больше всего прибавили: ${up.slice(0, 3).map(m => `<b>${esc(m.name)}</b> (${fmtS(m.d)}, ${fmtP(m.pct)})`).join(", ")}.` });
  if (dn.length) L.push({ k: "down", ico: "↓", html: `Сильнее всего просели: ${dn.slice(0, 3).map(m => `<b>${esc(m.name)}</b> (${fmtS(m.d)}, ${fmtP(m.pct)})`).join(", ")}.` });
  if (isNum(ta) && info.agg === "sum" && Math.abs(tb - ta) > 0) {
    const dTot = tb - ta; const sorted = mv.slice().sort((a, b) => Math.sign(dTot) * (b.d - a.d));
    let acc = 0, k = 0; for (const m of sorted) { acc += m.d; k++; if (Math.abs(acc) >= Math.abs(dTot) * 0.8 || k >= sorted.length) break; }
    if (k <= Math.max(3, mv.length * 0.3) && mv.length > 4) L.push({ k: "info", ico: "%", html: `Изменение сконцентрировано: <b>${k}</b> из ${mv.length} позиций дают 80% итогового ${dTot > 0 ? "прироста" : "снижения"}.` });
  }
  const nw = mv.filter(m => m.st === "new"), gone = mv.filter(m => m.st === "gone");
  if (nw.length) L.push({ k: "info", ico: "+", html: `Новые позиции (не было в «${esc(pair.la)}»): ${nw.slice(0, 4).map(m => `<b>${esc(m.name)}</b>`).join(", ")}${nw.length > 4 ? ` и ещё ${nw.length - 4}` : ""}.` });
  if (gone.length) L.push({ k: "warn", ico: "−", html: `Выбыли (нет данных в «${esc(pair.lb)}»): ${gone.slice(0, 4).map(m => `<b>${esc(m.name)}</b>`).join(", ")}${gone.length > 4 ? ` и ещё ${gone.length - 4}` : ""}.` });
  if (S.g !== "Y") {
    const an = visiblePos().map(p => ({ p, z: zScoreLatest(A.vals[p], pair.t) })).filter(x => isNum(x.z) && Math.abs(x.z) >= 2.5).sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
    if (an.length) L.push({ k: "warn", ico: "!", html: `Необычное изменение к прошлому ${GNAME[S.g]}у: ${an.slice(0, 3).map(x => `<b>${esc(DS.positions[x.p].name)}</b> (${x.z > 0 ? "выше" : "ниже"} нормы в ${nf(1).format(Math.abs(x.z))} раза по разбросу)`).join(", ")}. Проверьте данные или причину.` });
  }
  if (pair.partial) L.push({ k: "warn", ico: "!", html: `В сравнении участвует неполный ${GNAME[S.g]} — данные есть не за все месяцы. Сравнение может быть искажено.` });
  return L;
}

function runFactors() {
  const msg = $("#fa-msg"), wf = $("#fa-wf .card-b"), tb = $("#fa-pos .card-b"), cmp = $("#fa-cmp .card-b"), det = $("#fa-det .card-b");
  const extraHosts = ["#fa-mchart .card-b", "#fa-ord .card-b", "#fa-sens .card-b"].map(q => $(q));
  const clear = html => { wf.innerHTML = tb.innerHTML = cmp.innerHTML = det.innerHTML = html; extraHosts.forEach(h => h.innerHTML = html); $("#fa-concl .insights").innerHTML = ""; $("#fa-type").innerHTML = ""; $("#fa-order").innerHTML = ""; $("#fa-det-pos").innerHTML = ""; };
  if (!S.factor.formula.trim()) { msg.innerHTML = `<div class="muted">Соберите формулу, например <b>[Объём] × [Цена]</b> — и увидите, сколько изменения дал объём, а сколько цена.</div>`; clear(`<div class="empty">Ждём формулу</div>`); saveState(); return; }
  let M; try { M = parseModel(S.factor.formula, allMetricNames()); } catch (e) { msg.innerHTML = `<div class="alert">${esc(e.message)}</div>`; clear(""); return; }
  saveState();
  const k = M.vars.length;
  // порядок подстановки
  if (!Array.isArray(S.factor.order) || S.factor.order.length !== k || !S.factor.order.every(v => M.vars.includes(v))) S.factor.order = M.vars.slice();
  const ord = S.factor.order.map(v => M.vars.indexOf(v));
  $("#fa-type").innerHTML = `<span class="tag">Тип модели: ${FA_TYPES[M.type]}</span> <span class="muted" style="font-size:12.5px">Применимы: ${Object.keys(FA_METHODS).filter(m => M.applicable[m]).map(m => FA_SHORT[m]).join(", ")}</span>`;
  $("#fa-order").innerHTML = `<span class="muted">Порядок подстановки:</span>${ord.map((i, q) => `<span class="metric-chip" style="cursor:default">${q + 1}. ${esc(M.vars[i])}${q > 0 ? ` <button class="btn ghost sm" data-up="${q}" title="Подставлять раньше" style="height:20px;padding:0 4px">←</button>` : ""}</span>`).join("")}<span class="muted" style="font-size:12px">важен для цепных подстановок, абсолютных и относительных разниц, индексного; правило — сначала количественные факторы, потом качественные</span>`;
  $$("[data-up]").forEach(b => b.onclick = () => { const q = +b.dataset.up; const o = S.factor.order; [o[q - 1], o[q]] = [o[q], o[q - 1]]; runFactors(); });

  const prs = M.vars.map(m => comparePair(m));
  if (!prs[0].a) { msg.innerHTML = `<div class="alert">Для «${esc(prs[0].la)}» нет данных. Выберите другое сравнение сверху.</div>`; clear(""); return; }
  const P = visiblePos(); const methods = Object.keys(FA_METHODS);
  const R = {}; methods.forEach(m => R[m] = { eff: new Array(k).fill(0), fb: 0 });
  let Ya = 0, Yb = 0, newE = 0, goneE = 0, skipped = 0; const perPos = [];
  for (const p of P) {
    const xa = prs.map(pr => pr.a[p]), xb = prs.map(pr => pr.b[p]);
    const okA = xa.every(isNum), okB = xb.every(isNum);
    if (!okA && !okB) continue;
    if (okA && !okB) { const y = M.fn(xa); if (isNum(y)) { goneE -= y; Ya += y; } continue; }
    if (!okA && okB) { const y = M.fn(xb); if (isNum(y)) { newE += y; Yb += y; } continue; }
    const base = faMethod(M, "shapley", xa, xb, ord) || faMethod(M, "chain", xa, xb, ord);
    if (!base) { skipped++; continue; }
    Ya += base.ya; Yb += base.yb;
    const per = {};
    for (const m of methods) {
      if (!M.applicable[m]) continue;
      const r = m === "shapley" ? base : faMethod(M, m, xa, xb, ord);
      if (!r) { R[m].fb++; base.eff.forEach((e, i) => R[m].eff[i] += e); per[m] = null; continue; }   // к этим числам метод неприменим
      r.eff.forEach((e, i) => R[m].eff[i] += e); per[m] = r.eff;
    }
    perPos.push({ p, xa, xb, ya: base.ya, yb: base.yb, d: base.yb - base.ya, per });
  }
  const dY = Yb - Ya, main = M.applicable[S.factor.method] ? S.factor.method : "shapley";
  const resName = (() => { const hit = suggestFormulas().find(s => s.text === S.factor.formula); return hit ? hit.y : "Результат"; })();
  msg.innerHTML = `<div class="okmsg">${esc(resName)}: <b>${fmtC(Ya)}</b> (${esc(prs[0].la)}) → <b>${fmtC(Yb)}</b> (${esc(prs[0].lb)}), изменение <b>${fmtS(dY)}</b> (${fmtP(pctCh(Yb, Ya))}). Влияние посчитано по каждой позиции и сложено.${skipped ? ` ${skipped} поз. пропущено (деление на ноль).` : ""}${main !== S.factor.method ? ` Метод «${FA_METHODS[S.factor.method]}» к этой модели неприменим (${FA_NA[S.factor.method]}) — показан метод Шепли.` : ""}${M.vars.some(v => metricInfo(v).agg === "avg") && S.g !== DS.base ? " Для цен на укрупнённом шаге берётся среднее за период." : ""}</div>`;
  // 2. каскадная диаграмма основного метода
  $("#fa-wf .card-s").textContent = `Метод: ${FA_METHODS[main]}${R[main].fb ? ` (для ${R[main].fb} поз. метод неприменим к их числам — взят метод Шепли)` : ""}`;
  const steps = [{ name: prs[0].la, v: Ya, total: true }, ...M.vars.map((v, i) => ({ name: v, v: R[main].eff[i], tip: `<div class="t-r"><span>Доля в изменении</span><b>${dY ? nf(0).format(R[main].eff[i] / dY * 100) + "%" : "—"}</b></div>` }))];
  if (newE) steps.push({ name: "Новые позиции", v: newE }); if (goneE) steps.push({ name: "Выбывшие позиции", v: goneE });

  const check = avail.map(m => { const s = R[m].eff.reduce((a, b) => a + b, 0) + newE + goneE; const ok = Math.abs(s - dY) <= 1e-6 * Math.max(Math.abs(dY), Math.abs(Ya), 1); return `<td class="num"><span class="chip ${ok ? "up" : "down"}">${ok ? "✓ сходится" : "✗ " + fmtS(dY - s)}</span></td>`; }).join("");
  cmp.innerHTML = `<div class="tbl-wrap" style="max-height:none"><table class="tbl"><thead><tr><th class="l pos nosort">Фактор</th>${avail.map(m => `<th class="nosort" title="${esc(FA_METHODS[m])}" style="${m === main ? "color:var(--accent)" : ""}">${FA_SHORT[m]}</th>`).join("")}</tr></thead>

    <tr style="cursor:default"><td class="l pos">Проверка</td>${check}</tr></tbody></table></div>
    ${avail.some(m => R[m].fb) ? `<p class="muted" style="font-size:12.5px;margin:8px 0 0">${avail.filter(m => R[m].fb).map(m => `${FA_SHORT[m]}: для ${R[m].fb} поз. метод неприменим к их значениям (нули, смена знака) — для них взят метод Шепли`).join("; ")}.</p>` : ""}
    ${na.length ? `<p class="muted" style="font-size:12.5px;margin:6px 0 0">Не применимы к этой модели: ${na.map(m => `<b>${FA_SHORT[m]}</b> — ${FA_NA[m]}`).join("; ")}.</p>` : ""}
    <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Как считает каждый метод</summary><ul style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px">${methods.map(m => `<li><b>${FA_METHODS[m]}.</b> ${FA_HOW[m]}</li>`).join("")}</ul>
      <p class="muted" style="font-size:12.5px">Цепные подстановки, абсолютные и относительные разницы и индексный метод дают одинаковый результат, но зависят от порядка подстановки. Интегральный и Шепли от порядка не зависят — по ним удобно проверять выводы. Если методы сильно расходятся, значит велико совместное влияние факторов.</p></details>`;
  $("#fa-cmp-copy").onclick = () => copyText([["Фактор", ...avail.map(m => FA_METHODS[m])], ...M.vars.map((v, i) => [v, ...avail.map(m => R[m].eff[i])]), ["Итого", ...avail.map(m => R[m].eff.reduce((a, b) => a + b, 0) + newE + goneE)]]

function renderFaDetail(M, ord, perPos, prs) {
  const det = $("#fa-det .card-b"); const r = perPos.find(x => x.p === S.factor.detPos);
  if (!r) { det.innerHTML = `<div class="empty">Нет позиций с данными в обоих периодах.</div>`; return; }
  $("#fa-det-pos").value = String(r.p);
  const V = M.vars, k = V.length, la = prs[0].la, lb = prs[0].lb;
  const sub = (i, w) => `${esc(V[i])}${w ? "₁" : "₀"}`;
  const n = v => fmt(v), sg = v => (v > 0 ? "+" : "") + fmt(v);
  // исходные данные
  let html = `<div class="tbl-wrap" style="max-height:none;border-top:0"><table class="tbl"><thead><tr><th class="l nosort">Показатель</th><th class="nosort">${esc(la)} (₀)</th><th class="nosort">${esc(lb)} (₁)</th><th class="nosort">Абс. изменение</th><th class="nosort">Темп прироста</th><th class="nosort">Индекс</th></tr></thead><tbody>
    ${V.map((v, i) => `<tr style="cursor:default"><td class="l">${esc(v)}</td><td class="num">${n(r.xa[i])}</td><td class="num">${n(r.xb[i])}</td><td class="num">${sg(r.xb[i] - r.xa[i])}</td><td>${chip(pctCh(r.xb[i], r.xa[i]))}</td><td class="num">${r.xa[i] ? nf(4, 4).format(r.xb[i] / r.xa[i]) : "—"}</td></tr>`).join("")}
    <tr class="grp"><td class="l">Результат (по формуле)</td><td class="num">${n(r.ya)}</td><td class="num">${n(r.yb)}</td><td class="num">${sg(r.d)}</td><td>${chip(pctCh(r.yb, r.ya))}</td><td class="num">${r.ya ? nf(4, 4).format(r.yb / r.ya) : "—"}</td></tr></tbody></table></div>`;
  // цепные подстановки
  let cur = r.xa.slice(), prev = r.ya; const done = [];
  let chainRows = `<tr style="cursor:default"><td class="l">Y₀ (базисный)</td><td class="l mono" style="font-size:12px">${V.map((_, i) => sub(i, 0)).join(", ")}</td><td class="num">${n(r.ya)}</td><td></td></tr>`;
  ord.forEach((i, q) => { cur[i] = r.xb[i]; done.push(i); const y = M.fn(cur);
    chainRows += `<tr style="cursor:default"><td class="l">${q === k - 1 ? "Y₁ (отчётный)" : `Y усл.${q + 1}`}</td><td class="l mono" style="font-size:12px">${V.map((_, j) => sub(j, done.includes(j))).join(", ")}</td><td class="num">${n(y)}</td><td class="num" style="color:${y - prev >= 0 ? "var(--up)" : "var(--down)"}">ΔY(${esc(V[i])}) = ${sg(y - prev)}</td></tr>`; prev = y; });
  html += `<h4 style="margin:16px 0 6px">Цепные подстановки: условные показатели</h4><div class="tbl-wrap" style="max-height:none;border-top:0"><table class="tbl"><thead><tr><th class="l nosort">Показатель</th><th class="l nosort">Значения факторов</th><th class="nosort">Значение</th><th class="nosort">Влияние</th></tr></thead><tbody>${chainRows}</tbody></table></div>`;
  // формулы методов с числами
  const lines = [];
  if (M.pureMult) {
    const c = M.pp.c, cs = c !== 1 ? fmt(c) + " × " : "";
    ord.forEach((i, q) => { const before = ord.slice(0, q), after = ord.slice(q + 1);
      const sym = cs + [...before.map(j => sub(j, 1)), "Δ" + esc(V[i]), ...after.map(j => sub(j, 0))].join(" × ");
      const num = cs + [...before.map(j => n(r.xb[j])), "(" + sg(r.xb[i] - r.xa[i]) + ")", ...after.map(j => n(r.xa[j]))].join(" × ");
      lines.push(["abs", `ΔY(${esc(V[i])}) = ${sym} = ${num} = <b>${sg(r.per.abs[i])}</b>`]); });
    if (r.per.rel) { let acc = r.ya; ord.forEach(i => { const pc = (r.xb[i] - r.xa[i]) / r.xa[i] * 100;
      lines.push(["rel", `ΔY(${esc(V[i])}) = ${n(acc)} × ${nf(3).format(pc)}% / 100 = <b>${sg(acc * pc / 100)}</b>`]); acc += acc * pc / 100; }); }
  } else ord.forEach(i => lines.push(["abs", `ΔY(${esc(V[i])}) = Y(…, ${sub(i, 1)}, …) − Y(…, ${sub(i, 0)}, …) = <b>${sg(r.per.abs[i])}</b> (совпадает с цепными подстановками)`]));
  if (M.pp && r.per.index) { let cum = 1; ord.forEach(i => { const ip = Math.pow(r.xb[i] / r.xa[i], M.pp.p[i]);
    lines.push(["index", `ΔY(${esc(V[i])}) = Y₀ × ${cum === 1 ? "" : nf(4, 4).format(cum) + " × "}(I${M.pp.p[i] !== 1 ? "^" + fmt(M.pp.p[i]) : ""} − 1) = ${n(r.ya)} × ${cum === 1 ? "" : nf(4, 4).format(cum) + " × "}(${nf(4, 4).format(ip)} − 1) = <b>${sg(r.per.index[i])}</b>`]); cum *= ip; }); }
  if (M.pp && r.per.log && r.ya && r.yb / r.ya > 0) { const ly = Math.log(r.yb / r.ya); if (Math.abs(ly) > 1e-12) V.forEach((v, i) =>
    lines.push(["log", `ΔY(${esc(v)}) = ΔY × ${M.pp.p[i] !== 1 ? fmt(M.pp.p[i]) + " × " : ""}ln I(${esc(v)}) / ln I(Y) = ${sg(r.d)} × ${M.pp.p[i] !== 1 ? fmt(M.pp.p[i]) + " × " : ""}${nf(5).format(Math.log(r.xb[i] / r.xa[i]))} / ${nf(5).format(ly)} = <b>${sg(r.per.log[i])}</b>`])); }
  if (k === 2 && M.pureMult && r.per.integral) {
    const [a0, b0] = r.xa, da = r.xb[0] - r.xa[0], db = r.xb[1] - r.xa[1], c = M.pp.c, cs = c !== 1 ? fmt(c) + " × " : "";
    lines.push(["integral", `ΔY(${esc(V[0])}) = ${cs}(Δ${esc(V[0])} × ${sub(1, 0)} + Δ${esc(V[0])} × Δ${esc(V[1])} / 2) = ${cs}(${sg(da)} × ${n(b0)} + ${sg(da)} × ${sg(db)} / 2) = <b>${sg(r.per.integral[0])}</b>`]);
    lines.push(["integral", `ΔY(${esc(V[1])}) = ${cs}(Δ${esc(V[1])} × ${sub(0, 0)} + Δ${esc(V[0])} × Δ${esc(V[1])} / 2) = ${cs}(${sg(db)} × ${n(a0)} + ${sg(da)} × ${sg(db)} / 2) = <b>${sg(r.per.integral[1])}</b>`]);
  } else if (r.per.integral) V.forEach((v, i) => lines.push(["integral", `ΔY(${esc(v)}) = ∫ ∂Y/∂${esc(v)} d${esc(v)} по пути от базы к отчёту = <b>${sg(r.per.integral[i])}</b>`]));
  if (r.per.shapley) V.forEach((v, i) => lines.push(["shapley", `ΔY(${esc(v)}) = среднее по ${k === 1 ? 1 : [...Array(k).keys()].reduce((a, j) => a * (j + 1), 1)} порядкам подстановки = <b>${sg(r.per.shapley[i])}</b>`]));
  if (r.per.prop) V.forEach((v, i) => lines.push(["prop", `ΔY(${esc(v)}) = <b>${sg(r.per.prop[i])}</b>`]));
  Object.keys(FA_METHODS).forEach(m => { if (M.applicable[m] && r.per[m] === null) lines.push([m, `<span class="muted">к значениям этой позиции метод неприменим (${FA_NA[m] || "нули или смена знака"})</span>`]); });
  const byM = Object.keys(FA_METHODS).filter(m => lines.some(l => l[0] === m));
  html += `<h4 style="margin:16px 0 6px">Расчёт каждым методом</h4><div style="display:flex;flex-direction:column;gap:10px">${byM.map(m => `<div><div style="font-weight:600">${FA_METHODS[m]}</div><div class="mono" style="font-size:12.5px;line-height:1.7;overflow-x:auto">${lines.filter(l => l[0] === m).map(l => l[1]).join("<br>")}</div></div>`).join("")}</div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">₀ — значение в «${esc(la)}», ₁ — в «${esc(lb)}», Δ — изменение, I — индекс (отношение ₁ к ₀).</p>`;
  det.innerHTML = html;
}

/* ---------- Прогноз и сценарии ---------- */
VIEWS.forecast = c => {
  const A = agg(S.metric, S.g); const P = visiblePos(); const season = A.g === "M" ? 12 : A.g === "Q" ? 4 : 1;
  const maxH = A.g === "M" ? 24 : A.g === "Q" ? 8 : 5; const H = Math.min(S.fcH, maxH);
  const lastFull = A.full[A.keys.length - 1] ? A.keys.length : A.keys.length - 1;   // неполный последний период не используем
  const posF = P.map(p => ({ p, f: forecastSeries(A.vals[p].slice(0, lastFull), H, season) }));
  const histTot = totalSeries(A, P).slice(0, lastFull);
  let fc, lo, hi, method;
  if (A.agg === "sum") {
    const valid = posF.filter(x => x.f);
    fc = Array.from({ length: H }, (_, i) => sum(valid.map(x => x.f.fc[i])));
    const tf = forecastSeries(histTot, H, season); method = tf ? tf.method : "—";
    const sd = tf ? tf.sd : 0; lo = fc.map((v, k) => v - 1.28 * sd * Math.sqrt(1 + k * 0.25)); hi = fc.map((v, k) => v + 1.28 * sd * Math.sqrt(1 + k * 0.25));
  } else { const tf = forecastSeries(histTot, H, season); fc = tf ? tf.fc : []; lo = tf ? tf.lo : []; hi = tf ? tf.hi : []; method = tf ? tf.method : "—"; }
  const lastKey = A.keys[lastFull - 1]; const futKeys = Array.from({ length: H }, (_, i) => lastKey + (i + 1) * GSTEP[A.g]);
  const labels = A.labels.slice(0, lastFull).concat(futKeys.map(k => pLabel(k, A.g)));
  const scenPct = S.scen.all || 0; const groupPct = g => (S.scen["g:" + g] || 0);
  const scen = A.agg === "sum" ? Array.from({ length: H }, (_, i) => sum(posF.filter(x => x.f).map(x => x.f.fc[i] * (1 + (scenPct + groupPct(DS.positions[x.p].group)) / 100)))) : fc.map(v => v * (1 + scenPct / 100));
  const hasScen = scenPct !== 0 || Object.keys(S.scen).some(k => k.startsWith("g:") && S.scen[k]);
  c.insertAdjacentHTML("beforeend", pageHead("Прогноз и сценарии", `${esc(S.metric)}: прогноз на ${H} ${{ M: "мес.", Q: "кв.", Y: "г." }[S.g]} вперёд. Метод: ${method}. Это ориентир по прошлой динамике, а не обещание.`,
    `<span class="tb-label">Горизонт</span><div class="seg">${(A.g === "M" ? [3, 6, 12, 24] : A.g === "Q" ? [2, 4, 8] : [1, 3, 5]).map(h => `<button data-h="${h}" aria-pressed="${H === h}">${h}</button>`).join("")}</div>`));
  const sumH = sum(fc), sumS = sum(scen), lastYear = sum(histTot.slice(-H));
  c.insertAdjacentHTML("beforeend", `<div class="grid g-kpi">
    <div class="card kpi"><span class="kpi-label">${A.agg === "sum" ? "Прогноз за горизонт" : "Прогноз на конец горизонта"}</span><span class="kpi-value">${fmtC(A.agg === "sum" ? sumH : fc[H - 1])}</span><div class="kpi-row">${A.agg === "sum" ? chip(pctCh(sumH, lastYear)) + `<span>к последним ${H} ${GNAME[S.g]}ам факта</span>` : ""}</div></div>
    <div class="card kpi"><span class="kpi-label">Следующий ${GNAME[S.g]} · ${pLabel(futKeys[0], A.g)}</span><span class="kpi-value">${fmtC(fc[0])}</span><div class="kpi-row">80%: ${fmtC(lo[0])} … ${fmtC(hi[0])}</div></div>
    <div class="card kpi"><span class="kpi-label">Со сценарием</span><span class="kpi-value">${fmtC(A.agg === "sum" ? sumS : scen[H - 1])}</span><div class="kpi-row">${hasScen ? chip(pctCh(A.agg === "sum" ? sumS : scen[H - 1], A.agg === "sum" ? sumH : fc[H - 1])) + "<span>к базовому прогнозу</span>" : "<span>двигайте ползунки ниже</span>"}</div></div>
  </div>`);
  c.insertAdjacentHTML("beforeend", `<div class="grid g-2">${cardHTML("fc-chart", "Факт и прогноз", "Пунктир — прогноз, заливка — интервал, в который значение попадает с вероятностью ~80%", pngBtn("fc-chart"))}${cardHTML("fc-scen", "Сценарий «что если»", "Изменение относительно прогноза, %", `<button class="btn ghost sm" id="sc-reset">Сбросить</button>`, `<div id="sc-sliders" style="display:flex;flex-direction:column;gap:10px"></div>`)}</div>`);
  const pad = new Array(lastFull - 1).fill(NaN);

function dlFields() {
  const src = DS.src && DS.src.long ? DS.src : null;
  const metrics = DS.metrics.map(m => m.name);   // расчётных показателей в датасете DataLens нет
  return { fromFile: !!src, period: src ? src.period : "Период", pos: src ? src.pos : "Позиция",
    group: src ? src.group : (groups().length ? "Группа" : ""), metrics };
}
function dlCsv(F) {
  const names = F.metrics, ser = names.map(baseSeries), K = DS.keys, nK = K.length;
  const q = v => /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [[F.period, F.pos].concat(F.group ? [F.group] : [], names).map(q).join(";")];
  DS.positions.forEach((p, i) => K.forEach((k, t) => {
    const vals = ser.map(s => s ? s[i * nK + t] : NaN); if (!vals.some(isNum)) return;
    const d = Math.floor(k / 12) + "-" + String(k % 12 + 1).padStart(2, "0") + "-01";
    lines.push([d, q(p.name)].concat(F.group ? [q(p.group || "")] : [], vals.map(v => isNum(v) ? String(+v.toFixed(6)) : "")).join(";"));
  }));
  return "﻿" + lines.join("\n") + "\n";
}
function dlParseId(s) {
  s = String(s || "").trim(); if (!s) return { id: "" };
  if (/datasets\/new/i.test(s)) return { err: "Это адрес несохранённого датасета: в нём ID подключения, а не датасета. Сохраните датасет и скопируйте адрес заново." };
  if (/connections\//i.test(s)) return { err: "Это адрес подключения. Нужен адрес датасета (в нём есть /datasets/)." };
  const m = s.match(/datasets\/([a-z0-9]+)/i) || s.match(/^([a-z0-9]{6,})(?:-[^\s]*)?$/i);
  return m ? { id: m[1] } : { err: "Не похоже на адрес датасета. Скопируйте адрес страницы датасета целиком." };
}

        ord.forEach((i, q) => { cur[i] = r.xb[i]; done.push(i); const y = M.fn(cur); steps.push({label: q === k - 1 ? 'Y₁ (отчётный)' : 'Y усл.' + (q + 1), vals: M.vars.map((_, j) => sub(j, done.includes(j))).join(', '), y, eff: y - prev, f: M.vars[i]}); prev = y; });
        const lines = {};
        const L = (m, s) => { (lines[m] = lines[m] || []).push(s); };
        if (M.pureMult && r.per.abs) {
            const cs = M.pp.c !== 1 ? fmt(M.pp.c) + ' × ' : '';
            ord.forEach((i, q) => { const bf = ord.slice(0, q), af = ord.slice(q + 1);
                L('abs', 'ΔY(' + esc(M.vars[i]) + ') = ' + cs + bf.map((j) => sub(j, 1)).concat(['Δ' + esc(M.vars[i])], af.map((j) => sub(j, 0))).join(' × ') + ' = ' + cs + bf.map((j) => fmt(r.xb[j])).concat(['(' + sgn(r.xb[i] - r.xa[i]) + ')'], af.map((j) => fmt(r.xa[j]))).join(' × ') + ' = <b>' + sgn(r.per.abs[i]) + '</b>'); });
        } else if (r.per.abs) ord.forEach((i) => L('abs', 'ΔY(' + esc(M.vars[i]) + ') = Y(…, ' + sub(i, 1) + ', …) − Y(…, ' + sub(i, 0) + ', …) = <b>' + sgn(r.per.abs[i]) + '</b>'));
        if (r.per.rel) { let acc = r.ya; ord.forEach((i) => { const pc = (r.xb[i] - r.xa[i]) / r.xa[i] * 100; L('rel', 'ΔY(' + esc(M.vars[i]) + ') = ' + fmt(acc) + ' × ' + numStr(pc, 3) + '% / 100 = <b>' + sgn(acc * pc / 100) + '</b>'); acc += acc * pc / 100; }); }
        if (r.per.index) { let cum = 1; ord.forEach((i) => { const ip = Math.pow(r.xb[i] / r.xa[i], M.pp.p[i]); L('index', 'ΔY(' + esc(M.vars[i]) + ') = Y₀ × ' + (cum === 1 ? '' : numStr(cum, 4) + ' × ') + '(I − 1) = ' + fmt(r.ya) + ' × ' + (cum === 1 ? '' : numStr(cum, 4) + ' × ') + '(' + numStr(ip, 4) + ' − 1) = <b>' + sgn(r.per.index[i]) + '</b>'); cum *= ip; }); }
        if (r.per.log && r.yb / r.ya > 0 && Math.abs(Math.log(r.yb / r.ya)) > 1e-12) { const ly = Math.log(r.yb / r.ya); M.vars.forEach((v, i) => L('log', 'ΔY(' + esc(v) + ') = ΔY × ' + (M.pp.p[i] !== 1 ? fmt(M.pp.p[i]) + ' × ' : '') + 'ln I / ln I(Y) = ' + sgn(r.d) + ' × ' + numStr(Math.log(r.xb[i] / r.xa[i]), 5) + ' / ' + numStr(ly, 5) + ' = <b>' + sgn(r.per.log[i]) + '</b>')); }
        if (k === 2 && M.pureMult && r.per.integral) { const da = r.xb[0] - r.xa[0], db = r.xb[1] - r.xa[1];
            L('integral', 'ΔY(' + esc(M.vars[0]) + ') = Δ' + esc(M.vars[0]) + ' × ' + sub(1, 0) + ' + Δ' + esc(M.vars[0]) + ' × Δ' + esc(M.vars[1]) + ' / 2 = ' + sgn(da) + ' × ' + fmt(r.xa[1]) + ' + ' + sgn(da) + ' × ' + sgn(db) + ' / 2 = <b>' + sgn(r.per.integral[0]) + '</b>');
            L('integral', 'ΔY(' + esc(M.vars[1]) + ') = Δ' + esc(M.vars[1]) + ' × ' + sub(0, 0) + ' + Δ' + esc(M.vars[0]) + ' × Δ' + esc(M.vars[1]) + ' / 2 = ' + sgn(db) + ' × ' + fmt(r.xa[0]) + ' + ' + sgn(da) + ' × ' + sgn(db) + ' / 2 = <b>' + sgn(r.per.integral[1]) + '</b>');
        } else if (r.per.integral) M.vars.forEach((v, i) => L('integral', 'ΔY(' + esc(v) + ') = ∫ ∂Y/∂' + esc(v) + ' по пути от базы к отчёту = <b>' + sgn(r.per.integral[i]) + '</b>'));
        if (r.per.shapley) M.vars.forEach((v, i) => L('shapley', 'ΔY(' + esc(v) + ') = среднее по всем порядкам подстановки = <b>' + sgn(r.per.shapley[i]) + '</b>'));
        if (r.per.prop) M.vars.forEach((v, i) => L('prop', 'ΔY(' + esc(v) + ') = <b>' + sgn(r.per.prop[i]) + '</b>'));
        methods.forEach((m) => { if (r.per[m] === null) L(m, 'к значениям этой позиции метод неприменим (нули или смена знака)'); });
        return {name: r.name, group: r.group, xa: r.xa, xb: r.xb, ya: r.ya, yb: r.yb, d: r.d, per: r.per, steps, lines};
    });
    // выводы (по каждому методу — для переключения на клиенте)
    const conclusions = {};
    methods.forEach((m) => {
        const C = []; const eff = R[m].eff;
        C.push({k: dY >= 0 ? 'up' : 'down', t: base.resultName + ' ' + (dY > 0 ? 'вырос' : dY < 0 ? 'снизился' : 'не изменился') + ' с <b>' + fmtC(Ya) + '</b> до <b>' + fmtC(Yb) + '</b> (' + esc(la) + ' → ' + esc(lb) + '): на <b>' + fmtS(dY) + '</b> (' + fmtP(pct(Yb, Ya)) + ').'});
        const items = M.vars.map((v, i) => ({v, e: eff[i]})); if (newE) items.push({v: 'Новые позиции', e: newE}); if (goneE) items.push({v: 'Выбывшие позиции', e: goneE});
        const sh = (e) => dY ? ' — ' + (e / dY < 0 ? '−' : '') + numStr(Math.abs(e / dY * 100), 0) + '% изменения' : '';
        const up = items.filter((x) => x.e > 0).sort((a, b) => b.e - a.e), dn = items.filter((x) => x.e < 0).sort((a, b) => a.e - b.e);
        if (up.length) C.push({k: 'up', t: 'Увеличили: ' + up.map((x) => '<b>' + esc(x.v) + '</b> ' + fmtS(x.e) + sh(x.e)).join('; ') + '.'});
        if (dn.length) C.push({k: 'down', t: 'Уменьшили: ' + dn.map((x) => '<b>' + esc(x.v) + '</b> ' + fmtS(x.e) + sh(x.e)).join('; ') + '.'});
        const top = items.slice().sort((a, b) => Math.abs(b.e) - Math.abs(a.e))[0];
        if (top) C.push({k: 'info', t: 'Определяющий фактор — <b>' + esc(top.v) + '</b> (' + fmtS(top.e) + ').'});
        if (order) { const fl = order.stat.filter((s) => s.flip), spread = Math.max(...order.stat.map((s) => s.max - s.min));
            if (fl.length) C.push({k: 'warn', t: 'Знак влияния ' + fl.map((s) => '<b>' + esc(s.name) + '</b>').join(', ') + ' зависит от порядка подстановки — опирайтесь на интегральный метод или Шепли.'});
            else if (dY && spread / Math.abs(dY) > 0.05) C.push({k: 'warn', t: 'Цепные методы зависят от порядка подстановки (разброс до ' + numStr(spread / Math.abs(dY) * 100, 0) + '% изменения) — сверяйтесь с интегральным методом и Шепли.'});
            else C.push({k: 'info', t: 'От порядка подстановки результат почти не зависит — выводы устойчивы.'});
            if (order.sample) C.push({k: 'info', t: 'Устойчивость к порядку оценена по ' + order.sample + ' крупнейшим изменениям из ' + per.length + ' позиций (ограничение времени расчёта).'}); }
        if (R[m].fb) C.push({k: 'warn', t: 'Для ' + R[m].fb + ' поз. метод неприменим к их значениям (нули, смена знака) — для них взят метод Шепли.'});
        C.push({k: 'info', t: 'Проверка баланса: сумма влияний равна изменению результата.'});
        conclusions[m] = C;
    });
    let method = P('fa_method'); if (!M.applicable[method]) method = 'chain';
    return Object.assign(base, {
        method, methods, ord: ord.map((i) => M.vars[i]),
        R: methods.reduce((o, m) => { o[m] = {eff: R[m].eff, fb: R[m].fb}; return o; }, {}),
        Ya, Yb, dY, newE, goneE, skipped, positionsTotal: per.length,
        positions: per.slice(0, opt && opt.all ? per.length : opt && opt.lite ? 60 : 200).map((r) => ({name: r.name, group: r.group, ya: r.ya, yb: r.yb, d: r.d, per: r.per})),
        detail, order, sens, conclusions,
        names: FA_METHODS, short: FA_SHORT, na: FA_NA,
    });
}

/* =====================================================================
   Fiber Pulse целиком: расчёт всех разделов на сервере DataLens.
   Обзор, Позиции, Карта изменений, Карточка позиции, Прогноз
   (+ факторный анализ из computeFA выше).
   ===================================================================== */
const GSTEP = {M: 1, Q: 3, Y: 12}, GORD = {M: 0, Q: 1, Y: 2};
const gKey = (k, g) => g === 'M' ? k : g === 'Q' ? Math.floor(k / 12) * 12 + Math.floor((k % 12) / 3) * 3 : Math.floor(k / 12) * 12;
const sumN = (a) => { let s = 0, n = 0; for (const v of a) if (isNum(v)) { s += v; n++; } return n ? s : NaN; };
const meanN = (a) => { let s = 0, n = 0; for (const v of a) if (isNum(v)) { s += v; n++; } return n ? s / n : NaN; };
const listP = (name) => P(name).split(';').map((s) => s.trim()).filter(Boolean);
const rnd = (v) => isNum(v) ? +v.toPrecision(9) : null;
const rndA = (a) => a.map(rnd);
const rS = (v) => isNum(v) ? +v.toPrecision(6) : null;       // для графиков достаточно 6 знаков
const rSA = (a) => a.map(rS);
const DETAIL_MAX = 80, TABLE_MAX = 150, HEAT_MAX = 120, FC_ROWS = 50;

function forecastSeries(y, h, season) {
    const first = y.findIndex(isNum); if (first < 0) return null;
    if (!isNum(y[y.length - 1])) return null;
    const s = y.slice(first); const n = s.length;
    if (n < 4) return null;
    for (let i = 1; i < n; i++) if (!isNum(s[i])) s[i] = s[i - 1];
    const lin = (arr) => { const m = arr.length, mx = (m - 1) / 2, my = meanN(arr); let sxy = 0, sxx = 0; arr.forEach((v, i) => { sxy += (i - mx) * (v - my); sxx += (i - mx) * (i - mx); }); const b = sxx ? sxy / sxx : 0; return {a: my - b * mx, b}; };
    let fit = [], fc = [], method;
    if (season > 1 && n >= 2 * season) {
        method = 'сезонность + тренд';
        const tr = lin(s); const mult = s.every((v) => v > 0) && tr.a > 0 && tr.a + tr.b * (n - 1) > 0;
        const idx = new Array(season).fill(0).map(() => []);
        s.forEach((v, i) => { const t = tr.a + tr.b * i; idx[i % season].push(mult ? v / t : v - t); });
        let si = idx.map(meanN); const norm = meanN(si); si = si.map((v) => mult ? v / norm : v - norm);
        const des = s.map((v, i) => mult ? v / si[i % season] : v - si[i % season]);
        const w = Math.min(n, season * 3); const tr2 = lin(des.slice(n - w)); const off = n - w;
        const val = (i) => { const t = tr2.a + tr2.b * (i - off); return mult ? t * si[i % season] : t + si[i % season]; };
        fit = s.map((_, i) => val(i)); for (let i = n; i < n + h; i++) fc.push(val(i));
    } else {
        method = 'тренд (Холт)';
        const al = 0.5, be = 0.2, ph = 0.9; let lv = s[0], tr = s[1] - s[0];
        fit.push(s[0]);
        for (let i = 1; i < n; i++) { fit.push(lv + ph * tr); const nl = al * s[i] + (1 - al) * (lv + ph * tr); tr = be * (nl - lv) + (1 - be) * ph * tr; lv = nl; }
        let damp = 0; for (let k = 1; k <= h; k++) { damp += Math.pow(ph, k); fc.push(lv + damp * tr); }
    }
    const res = s.map((v, i) => v - fit[i]).slice(season > 1 ? Math.min(season, Math.floor(n / 3)) : 1);
    const sd = Math.sqrt(meanN(res.map((r) => r * r))) || 0;
    return {fc, method, sd};
}

function computeApp() {
    const fPeriod = P('fa_period'), fPos = P('fa_position'), fGroup = P('fa_group');
    if (!fPeriod) throw new Error('Не задано поле периода (параметр fa_period на вкладке Params).');
    const formula = P('fa_formula');
    const fvars = []; formula.replace(/\[([^\]]+)\]/g, (_, n) => { n = n.trim(); if (!fvars.includes(n)) fvars.push(n); return ''; });
    let metrics = listP('fa_metrics'); if (!metrics.length) metrics = fvars.slice();
    metrics = metrics.filter((m, i, a) => a.indexOf(m) === i).slice(0, 8);
    if (!metrics.length) throw new Error('Не заданы показатели: впишите числовые поля в параметр fa_metrics на вкладке Params.');
    const columns = [fPeriod, fPos, fGroup].concat(metrics, fvars).filter((c, i, a) => c && a.indexOf(c) === i);
    const rows = loadRows(columns);
    if (!rows.length) throw new Error('Датасет вернул 0 строк. Проверьте ID датасета на вкладке Meta.');
    const missing = columns.filter((c) => !(c in rows[0]));
    if (missing.length) throw new Error('В датасете нет полей: ' + missing.join(', ') + '. Есть: ' + Object.keys(rows[0]).join(', '));
    const avgList = listP('fa_avg_fields');
    const isAvg = (m) => avgList.length ? avgList.includes(m) : guessAvg(m);

    /* ---- периоды и шаг ---- */
    let gMin = 2; const bad = [];
    const parsed = rows.map((r) => { const p = parsePeriod(r[fPeriod]); if (p) gMin = Math.min(gMin, GORD[p.g]); else if (bad.length < 3) bad.push(String(r[fPeriod])); return p; });
    if (!parsed.some(Boolean)) throw new Error('Не удалось распознать периоды в поле «' + fPeriod + '»' + (bad.length ? ' (например: ' + bad.join(', ') + ')' : '') + '. Нужны даты или месяцы.');
    const base = ['M', 'Q', 'Y'][gMin];
    const G = ['M', 'Q', 'Y'][Math.max(gMin, GORD[P('fa_grain')] || 0)];

    /* ---- позиции и группы ---- */
    const grpFilter = P('fa_group_filter');
    const posMap = new Map(), keySet = new Set(), baseSeen = new Map(), recs = [];
    rows.forEach((r, i) => {
        const p = parsed[i]; if (!p) return;
        const pos = fPos ? String(r[fPos] == null ? '—' : r[fPos]) : 'Итого';
        const grp = fGroup ? String(r[fGroup] == null ? '' : r[fGroup]) : '';
        if (!posMap.has(pos)) posMap.set(pos, {name: pos, group: grp}); else if (grp && !posMap.get(pos).group) posMap.get(pos).group = grp;
        const k = gKey(p.key, G); keySet.add(k);
        if (!baseSeen.has(k)) baseSeen.set(k, new Set()); baseSeen.get(k).add(gKey(p.key, base));
        recs.push([pos, k, r]);
    });
    const allGroups = Array.from(new Set(Array.from(posMap.values()).map((p) => p.group).filter(Boolean))).sort();
    const positions = Array.from(posMap.values()).filter((p) => !grpFilter || p.group === grpFilter);
    if (!positions.length) throw new Error('В группе «' + grpFilter + '» нет позиций. Нажмите «Все группы».');
    const pIndex = new Map(positions.map((p, i) => [p.name, i]));
    const ks = Array.from(keySet).sort((a, b) => a - b);
    const keys = []; for (let k = ks[0]; k <= ks[ks.length - 1]; k += GSTEP[G]) keys.push(k);
    const kIndex = new Map(keys.map((k, i) => [k, i]));
    const nP = positions.length, nK = keys.length;
    const per = Math.round(GSTEP[G] / GSTEP[base]);
    const full = keys.map((k) => (baseSeen.has(k) ? baseSeen.get(k).size : 0) >= per);
    const labels = keys.map((k) => pLabel(k, G));

    /* ---- значения: показатель → [позиция × период] ---- */
    const V = {}, metaM = [], SS = metrics.map(() => new Array(nP * nK).fill(0)), CC = metrics.map(() => new Array(nP * nK).fill(0)), nM = metrics.length;
    recs.forEach((x) => {
        const pi = pIndex.get(x[0]); if (pi == null) return; const j = pi * nK + kIndex.get(x[1]), r = x[2];
        for (let q = 0; q < nM; q++) { const v = parseNum(r[metrics[q]]); if (isNum(v)) { SS[q][j] += v; CC[q][j]++; } }
    });
    metrics.forEach((m, q) => { const avg = isAvg(m), s = SS[q], c = CC[q]; V[m] = s.map((x, j) => c[j] ? (avg ? x / c[j] : x) : NaN); metaM.push({name: m, agg: avg ? 'avg' : 'sum'}); });
    let main = P('fa_metric'); if (!metrics.includes(main)) main = metrics.find((n) => /выручк|продаж|revenue|sales|затрат|расход|сумм|оборот|доход/i.test(n)) || metrics[0];

    /* ---- выбранный период и база сравнения ---- */
    const notes = [];
    const pb = P('fa_period_b'), cmp = P('fa_compare') || 'yoy';
    let t = nK - 1;
    if (pb && pb !== 'last') { const p = parsePeriod(pb); const i = p ? kIndex.get(gKey(p.key, G)) : undefined; if (i != null) t = i; else notes.push('Период «' + pb + '» не найден — взят последний.'); }
    let ta = -1;
    if (cmp === 'prev') ta = t - 1;
    else if (cmp === 'custom') { const p = parsePeriod(P('fa_period_a')); const i = p ? kIndex.get(gKey(p.key, G)) : undefined; ta = i == null ? -1 : i; if (ta < 0) notes.push('Базисный период fa_period_a не найден.'); }
    else { const i = kIndex.get(keys[t] - 12); ta = i == null ? -1 : i; }
    const la = ta >= 0 ? labels[ta] : (cmp === 'yoy' ? pLabel(keys[t] - 12, G) : '—'), lb = labels[t];
    const shift = G === 'M' ? 12 : G === 'Q' ? 4 : 1, season = shift;
    const yoyI = (i) => { const j = kIndex.get(keys[i] - 12); return j == null ? -1 : j; };

    /* ---- карточки позиций: крупнейшие по основному показателю ---- */
    const mv0 = V[main], val0 = (p, i) => mv0[p * nK + i];
    const rank = positions.map((_, p) => { let v = val0(p, t); if (!isNum(v)) v = sumN(keys.map((_, i) => val0(p, i))) / nK; return {p, v: isNum(v) ? Math.abs(v) : -1}; }).sort((a, b) => b.v - a.v);
    const dList = rank.slice(0, DETAIL_MAX).map((x) => x.p), dIdx = new Map(dList.map((p, i) => [p, i]));
    const detail = dList.map((p) => ({name: positions[p].name, group: positions[p].group, v: metrics.reduce((o, m) => { o[m] = rSA(V[m].slice(p * nK, p * nK + nK)); return o; }, {})}));
    const di = (p) => dIdx.has(p) ? dIdx.get(p) : -1;

    /* ---- расчёт по каждому показателю ---- */
    const lastFull = full[nK - 1] ? nK : nK - 1;
    const Hmax = G === 'M' ? 24 : G === 'Q' ? 8 : 5;
    const M = {};
    metaM.forEach((mm) => {
        const m = mm.name, v = V[m], agg = mm.agg, red = agg === 'avg' ? meanN : sumN;
        const val = (p, i) => i >= 0 && i < nK ? v[p * nK + i] : NaN;
        const col = (i) => Array.from({length: nP}, (_, p) => val(p, i));
        const tot = keys.map((_, i) => red(col(i)));
        const b = col(t), a = ta >= 0 ? col(ta) : null;
        const curTot = red(b), baseTot = a ? red(a) : NaN;
        // движение позиций
        const mv = [];
        for (let p = 0; p < nP; p++) {
            const x = a ? a[p] : NaN, y = b[p]; if (!isNum(x) && !isNum(y)) continue;
            const st = !isNum(x) ? 'new' : !isNum(y) ? 'gone' : 'both';
            mv.push({p, name: positions[p].name, a: x, b: y, d: (isNum(y) ? y : 0) - (isNum(x) ? x : 0), pct: st === 'both' ? pct(y, x) : NaN, st});
        }
        const both = mv.filter((x) => x.st === 'both');
        const up = both.filter((x) => x.d > 0).sort((p, q) => q.d - p.d), dn = both.filter((x) => x.d < 0).sort((p, q) => p.d - q.d);
        const pk = (x) => x ? {name: x.name, di: di(x.p), d: rnd(x.d), pct: rnd(x.pct)} : null;
        // мост
        let bridge = null;
        if (a && agg === 'sum') {
            const ranked = mv.slice().sort((p, q) => Math.abs(q.d) - Math.abs(p.d)), top = ranked.slice(0, 7), rest = ranked.slice(7);
            bridge = [{name: la, v: rnd(sumN(a) || 0), total: true}].concat(top.map((x) => ({name: x.name, v: rnd(x.d), di: di(x.p)})), rest.length ? [{name: 'Прочие (' + rest.length + ')', v: rnd(rest.reduce((s, x) => s + x.d, 0))}] : [], [{name: lb, v: rnd(curTot), total: true}]);
        }
        const ranked2 = mv.filter((x) => isNum(x.d) && x.d !== 0).sort((p, q) => q.d - p.d);
        const shown = ranked2.length > 12 ? ranked2.slice(0, 6).concat(ranked2.slice(-6)) : ranked2;
        // выводы
        const ins = [];

            if (order.sample) C.push({k: 'info', t: 'Устойчивость к порядку оценена по ' + order.sample + ' крупнейшим изменениям из ' + per.length + ' позиций (ограничение времени расчёта).'}); }
        if (R[m].fb) C.push({k: 'warn', t: 'Для ' + R[m].fb + ' поз. метод неприменим к их значениям (нули, смена знака) — для них взят метод Шепли.'});
        C.push({k: 'info', t: 'Проверка баланса: сумма влияний равна изменению результата.'});
        conclusions[m] = C;
    });
    let method = P('fa_method'); if (!M.applicable[method]) method = 'chain';
    return Object.assign(base, {
        method, methods, ord: ord.map((i) => M.vars[i]),
        R: methods.reduce((o, m) => { o[m] = {eff: R[m].eff, fb: R[m].fb}; return o; }, {}),
        Ya, Yb, dY, newE, goneE, skipped, positionsTotal: per.length,
        positions: per.slice(0, opt && opt.all ? per.length : opt && opt.lite ? 60 : 200).map((r) => ({name: r.name, group: r.group, ya: r.ya, yb: r.yb, d: r.d, per: r.per})),
        detail, order, sens, conclusions,
        names: FA_METHODS, short: FA_SHORT, na: FA_NA,
    });
}

/* =====================================================================
   Чарт-таблица: влияние факторов по каждой позиции (сортировка, Excel).
   ===================================================================== */
let T;
try { T = computeFA({all: true}); } catch (e) { T = {error: String(e && e.message || e)}; }

const cellN = (v, txt) => ({value: isNum(v) ? v : null, formattedValue: txt != null ? txt : (isNum(v) ? fmt(v) : '—'), type: 'number'});
const cellT = (v) => ({value: String(v == null ? '' : v), type: 'text'});
let table;
if (T.error || T.empty) {
    table = {head: [{id: 'msg', name: 'Факторный анализ', type: 'text'}], rows: [{cells: [cellT(T.error || T.empty)]}]};
} else {
    const m = T.method, effName = (v) => 'Влияние: ' + v;
    const head = [
        {id: 'pos', name: P('fa_position') || 'Позиция', type: 'text'},
        {id: 'grp', name: P('fa_group') || 'Группа', type: 'text'},
        {id: 'ya', name: T.resultName + ' · ' + T.la, type: 'number'},
        {id: 'yb', name: T.resultName + ' · ' + T.lb, type: 'number'},
        {id: 'd', name: 'Изменение', type: 'number'},
        {id: 'dp', name: 'Изменение, %', type: 'number'},
    ].concat(T.vars.map((v, i) => ({id: 'f' + i, name: effName(v), type: 'number'})));
    const rows = T.positions.map((p) => {
        const pe = p.per[m] || p.per.shapley || p.per.chain || [];
        const dp = pct(p.yb, p.ya);
        return {cells: [cellT(p.name), cellT(p.group), cellN(p.ya), cellN(p.yb), cellN(p.d, sgn(p.d)), cellN(dp, fmtP(dp))].concat(T.vars.map((_, i) => cellN(pe[i], sgn(pe[i]))))};
    });
    if (T.newE) rows.push({cells: [cellT('Новые позиции'), cellT(''), cellN(0), cellN(T.newE), cellN(T.newE, sgn(T.newE)), cellN(null)].concat(T.vars.map(() => cellN(null)))});
    if (T.goneE) rows.push({cells: [cellT('Выбывшие позиции'), cellT(''), cellN(-T.goneE), cellN(0), cellN(T.goneE, sgn(T.goneE)), cellN(null)].concat(T.vars.map(() => cellN(null)))});
    const dpT = pct(T.Yb, T.Ya);
    const footer = [{cells: [cellT('Итого · метод: ' + T.names[m] + (T.positionsTotal > T.positions.length ? ' (в таблице ' + T.positions.length + ' крупнейших из ' + T.positionsTotal + ')' : '')), cellT(''), cellN(T.Ya), cellN(T.Yb), cellN(T.dY, sgn(T.dY)), cellN(dpT, fmtP(dpT))].concat(T.R[m].eff.map((e) => cellN(e, sgn(e))))}];
    table = {head, rows, footer};
}
module.exports = table;
</script>
